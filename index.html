		#container h1,

			transform: translate3d(0, 0, 0);

		#container h1.transition-in,
		#container h2.transition-in {

		#container h1.transition-in [class^="letter"],
		#container h2.transition-in [class^="letter"] {

<body>

	<script>
    // 用户点击页面任意位置后立即播放音乐
    document.addEventListener('click', function() {
        const audio = document.getElementById('audios');
        if(audio.paused) audio.play();
    });

    // 鼠标滑轮控制正方体大小 (and pinch zoom on touch)
    (function(){
        var cube = document.querySelector('.cube');
        var wrap = document.querySelector('.cube-wrap');
        var scale = 1;
        function apply(){
            wrap.style.transform = 'scale(' + scale + ')';
        }
        window.addEventListener('wheel', function(e){
            e.preventDefault();
            scale += (e.deltaY < 0 ? 0.08 : -0.08);
            scale = Math.max(0.2, Math.min(8, scale));
            apply();
        }, { passive: false });

        var startDist = 0;
        var startScale = 1;
        function dist(t){
            var dx = t[0].clientX - t[1].clientX;
            var dy = t[0].clientY - t[1].clientY;
            return Math.sqrt(dx*dx + dy*dy);
        }
        document.addEventListener('touchstart', function(e){
            if(e.touches.length >= 2){
                startDist = dist(e.touches);
                startScale = scale;
                // 缩放进行中：暂停 CSS 自转动画，避免"scale + rotate"每帧双重 3D 合成，缩小才不卡
                cube.style.animationPlayState = 'paused';
            }
        }, { passive: true });
        document.addEventListener('touchmove', function(e){
            if(e.touches.length >= 2){
                e.preventDefault();
                var d = dist(e.touches);
                scale = startScale * (d / startDist);
                scale = Math.max(0.2, Math.min(8, scale));
                apply();
            }
        }, { passive: false });
        // 双指离开，恢复自转动画
        document.addEventListener('touchend', function(e){
            if(e.touches.length < 2){
                cube.style.animationPlayState = 'running';
            }
        }, { passive: true });
    })();
	</script>

	<!-- 鼠标拖尾特效 (来自 mouse_trail.html) -->
	<script>
	(function(){
	  var canvas = document.getElementById('trailCanvas');
	  var W = window.innerWidth;
	  var H = window.innerHeight;
	  canvas.width = W;
	  canvas.height = H;
	  var ctx = canvas.getContext('2d');
	  window.addEventListener('resize', function(){
	    canvas.width = window.innerWidth;
	    canvas.height = window.innerHeight;
	  });

	  var target = { x: W/2, y: H/2 };
	  var trails = 20;
	  var size = 50;
	  var dampening = 0.25;
	  var tension = 0.98;
	  var huePhase = 0;

	  function hueNow(){
	    huePhase += 0.0015;
	    return 285 + Math.sin(huePhase)*85;
	  }

	  function Node(){
	    this.x = target.x;
	    this.y = target.y;
	    this.vx = 0;
	    this.vy = 0;
	  }

	  function Tendril(spring){
	    this.spring = spring + (Math.random()*0.1) - 0.05;
	    this.friction = 0.5 + (Math.random()*0.01) - 0.005;
	    this.nodes = [];
	    for(var i=0;i<size;i++){ this.nodes.push(new Node()); }
	  }
	  Tendril.prototype.update = function(){
	    var spring = this.spring;
	    var node = this.nodes[0];
	    node.vx += (target.x - node.x) * spring;
	    node.vy += (target.y - node.y) * spring;
	    for(var i=0, prev, n=this.nodes.length; i<n; i++){
	      node = this.nodes[i];
	      if(i>0){
	        prev = this.nodes[i-1];
	        node.vx += (prev.x - node.x) * spring;
	        node.vy += (prev.y - node.y) * spring;
	        node.vx += prev.vx * dampening;
	        node.vy += prev.vy * dampening;
	      }
	      node.vx *= this.friction;
	      node.vy *= this.friction;
	      node.x += node.vx;
	      node.y += node.vy;
	      spring *= tension;
	    }
	  };
	  Tendril.prototype.draw = function(){
	    var n = this.nodes;
	    var a, b, x, y;
	    ctx.beginPath();
	    ctx.moveTo(n[0].x, n[0].y);
	    for(var i=1, m=n.length-2; i<m; i++){
	      a = n[i]; b = n[i+1];
	      x = (a.x + b.x) * 0.5;
	      y = (a.y + b.y) * 0.5;
	      ctx.quadraticCurveTo(a.x, a.y, x, y);
	    }
	    a = n[i]; b = n[i+1];
	    ctx.quadraticCurveTo(a.x, a.y, b.x, b.y);
	    ctx.stroke();
	  };

	  var tendrils = [];
	  function reset(){
	    tendrils = [];
	    for(var i=0;i<trails;i++){ tendrils.push(new Tendril(0.45 + 0.025*(i/trails))); }
	  }
	  reset();

	  document.addEventListener('mousemove', function(e){
	    target.x = e.clientX;
	    target.y = e.clientY;
	  });
	  document.addEventListener('touchmove', function(e){
	    if(e.touches.length){ target.x = e.touches[0].pageX; target.y = e.touches[0].pageY; }
	  }, {passive:true});
	  document.addEventListener('touchstart', function(e){
	    if(e.touches.length){ target.x = e.touches[0].pageX; target.y = e.touches[0].pageY; }
	  }, {passive:true});

	  function loop(){
	    ctx.globalCompositeOperation = 'source-over';
	    ctx.fillStyle = 'rgba(8,5,16,0.4)';
	    ctx.fillRect(0, 0, canvas.width, canvas.height);
	    ctx.globalCompositeOperation = 'lighter';
	    ctx.strokeStyle = 'hsla(' + Math.round(hueNow()) + ',90%,55%,0.6)';
	    ctx.lineWidth = 2;
	    for(var i=0;i<tendrils.length;i++){
	      tendrils[i].update();
	      tendrils[i].draw();
	    }
	    requestAnimationFrame(loop);
	  }
	  loop();
	})();
	</script>

	<!-- 文字特效逐字淡入 -->
	<script>
	    (function(){
	        function letters(id) {
	            var el = document.getElementById(id),
	                arr = el.innerHTML.split(''),
	                heading = '';
	            for (var i = 0; i < arr.length; i++) {
	                heading += arr[i].trim() ? '<span class="letter-' + i + '">' + arr[i] + '</span>' : '&nbsp;';
	            }
	            el.innerHTML = heading;
	            setTimeout(function(){ el.className = 'transition-in'; }, (Math.random() * 500) + 350);
	        }
	        letters('h1');
	        letters('h2');
	        letters('h3');
	    })();
	</script>
